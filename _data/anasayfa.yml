  baslik: "Dizinin devamı Instagram'da"
  metin: "Her akşam yeni bir bölüm; bir sonraki bölümü sen seçiyorsun. Sezon finalinde en güzel dört takipçi hikâyesi Dört Hikâye kutusunun kartlarına basılacak."
  dm_notu: "DM'den **HİKÂYE** yaz, sana en uygun akşamı birlikte seçelim."
  gorseller:
