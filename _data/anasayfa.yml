bulten:
  etiket: "TÜTİ'NİN MEKTUPLARI"
  baslik: "Ayda iki mektup, bir sürü hikâye"
  metin: "Yeni bölüm, mevsimin kokusu, takipçi hikâyelerinden seçmeler ve yeni kutular duyulmadan önce sende. Reklam yağmuru yok, sadece mektup."
  yakinda_notu: "Bülten çok yakında. Şimdilik haber almak istersen bize e-posta at, listeye ilk sen gir."
